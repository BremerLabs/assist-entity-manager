name: Apply v1.2.0 release payload

on:
  push:
    branches:
      - release/v1.2.0

permissions:
  contents: write

jobs:
  apply-release:
    if: github.event.head_commit.message == 'Prepare clean v1.2.0 release payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.0
          fetch-depth: 0

      - name: Rebuild verified release payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .aem-payload/chunk-00 \
            .aem-payload/chunk-01-02 \
            .aem-payload/chunk-03 \
            .aem-payload/chunk-04 \
            .aem-payload/chunk-05-06 \
            .aem-payload/chunk-07-08 \
            .aem-payload/chunk-09-10 \
            .aem-payload/chunk-11-12 \
            .aem-payload/chunk-13-14 \
            .aem-payload/chunk-15-16 \
            .aem-payload/chunk-17-18 \
            .aem-payload/chunk-19-20 \
            .aem-payload/chunk-21 \
            .aem-payload/chunk-22a \
            .aem-payload/chunk-22b \
            .aem-payload/chunk-22c \
            .aem-payload/chunk-22d > /tmp/aem.b64
          base64 --decode /tmp/aem.b64 > /tmp/aem.zip
          echo '19649c54f58bd505e91d6a8068a74b6394e815bea0f5b1c54eef507f433dcc29  /tmp/aem.zip' | sha256sum -c -
          unzip -t /tmp/aem.zip
          rm -rf /tmp/aem && mkdir -p /tmp/aem
          unzip -q /tmp/aem.zip -d /tmp/aem
          rm -f /tmp/aem/custom_components/assist_entity_manager/frontend/assist-manager-background.svg
          cp -a /tmp/aem/. .
          rm -rf .aem-payload
          rm -f .github/workflows/apply-v120-payload.yml

      - name: Validate v1.2.0
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/assist_entity_manager
          node --check custom_components/assist_entity_manager/frontend/assist-entity-manager.js
          node --check custom_components/assist_entity_manager/frontend/assist-entity-manager.en.js
          node --check custom_components/assist_entity_manager/frontend/assist-entity-manager.de.js
          node --check custom_components/assist_entity_manager/frontend/aem-runtime-fixes.js
          node --check custom_components/assist_entity_manager/frontend/aem-orphan-manager.js
          test "$(python -c "import json; print(json.load(open('custom_components/assist_entity_manager/manifest.json'))['version'])")" = "1.2.0"
          grep -F 'VERSION = "1.2.0"' custom_components/assist_entity_manager/const.py
          grep -F 'Amazon Alexa (Manuell/YAML) · BETA' custom_components/assist_entity_manager/frontend/assist-entity-manager.de.js
          grep -F 'Amazon Alexa (Manual/YAML) · BETA' custom_components/assist_entity_manager/frontend/assist-entity-manager.en.js
          grep -F 'Verwaiste Entitäten · BETA' custom_components/assist_entity_manager/frontend/aem-orphan-manager.js
          grep -F 'Orphaned entities · BETA' custom_components/assist_entity_manager/frontend/aem-orphan-manager.js

      - name: Commit clean release branch
        shell: bash
        run: |
          set -euo pipefail
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'BremerLabs'
          git config user.email 'domenicbremer@icloud.com'
          git add -A
          git commit -m 'Prepare Assist Entity Manager v1.2.0'
          git push origin HEAD:release/v1.2.0
